<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
<title id="title">ADRpy-VTOL workflow and separate downstream ADRpy analysis</title>
<desc id="desc">UAV market data enters preparation, the predictor, model inspection and design assistance. The user defines initial aircraft parameters and transfers inputs to ADRpy, outside the software boundary. Modules run separately; the assistant reads Excel rather than consuming a validated dashboard result.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="625" fill="#ffffff"/>
<rect x="300" y="85" width="865" height="430" rx="18" fill="#f4faf8" stroke="#88bdb2" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif">
<polyline points="255,225 335,225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="555,225 605,225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="845,225 895,225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1012.5,283 1012.5,365" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<polyline points="895,423 845,423" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="605,423 255,423" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<g id="market"><rect x="35" y="167" width="220" height="116" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50" y="192" font-size="12" font-weight="bold" fill="#475569">INPUT</text>
<text x="50" y="219" font-size="18" font-weight="bold" fill="#142c43">UAV market data</text>
<text x="50" y="245" font-size="14" font-weight="normal" fill="#475569">Incomplete specifications</text>
<text x="50" y="266" font-size="14" font-weight="normal" fill="#475569">Excel workbook</text>
</g>
<g id="prep"><rect x="335" y="167" width="220" height="116" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="350" y="192" font-size="12" font-weight="bold" fill="#475569">DATA PREPARATION</text>
<text x="350" y="219" font-size="18" font-weight="bold" fill="#142c43">Load and prepare</text>
<text x="350" y="245" font-size="14" font-weight="normal" fill="#475569">Columns, available values</text>
<text x="350" y="266" font-size="14" font-weight="normal" fill="#475569">and derived parameters</text>
</g>
<g id="engine"><rect x="605" y="167" width="240" height="116" rx="10" fill="#ffffff" stroke="#149080" stroke-width="1.5"/>
<text x="620" y="192" font-size="12" font-weight="bold" fill="#475569">1 / PREDICTOR</text>
<text x="620" y="219" font-size="18" font-weight="bold" fill="#142c43">Estimate missing values</text>
<text x="620" y="245" font-size="14" font-weight="normal" fill="#475569">Similarity + regression</text>
<text x="620" y="266" font-size="14" font-weight="normal" fill="#475569">Excel + model JSON</text>
</g>
<g id="inspect"><rect x="895" y="167" width="235" height="116" rx="10" fill="#ffffff" stroke="#149080" stroke-width="1.5"/>
<text x="910" y="192" font-size="12" font-weight="bold" fill="#475569">2 / MODEL INSPECTION</text>
<text x="910" y="219" font-size="18" font-weight="bold" fill="#142c43">Inspect fitted models</text>
<text x="910" y="245" font-size="14" font-weight="normal" fill="#475569">Interactive plots, metrics</text>
<text x="910" y="266" font-size="14" font-weight="normal" fill="#475569">and warnings</text>
</g>
<g id="assistant"><rect x="895" y="365" width="235" height="116" rx="10" fill="#ffffff" stroke="#149080" stroke-width="1.5"/>
<text x="910" y="390" font-size="12" font-weight="bold" fill="#475569">3 / DESIGN ASSISTANT</text>
<text x="910" y="417" font-size="18" font-weight="bold" fill="#142c43">Explore design choices</text>
<text x="910" y="443" font-size="14" font-weight="normal" fill="#475569">Reads Excel; ranks aircraft</text>
<text x="910" y="464" font-size="14" font-weight="normal" fill="#475569">and suggests parameters</text>
</g>
<g id="params"><rect x="605" y="365" width="240" height="116" rx="10" fill="#e2f3ef" stroke="#149080" stroke-width="1.5"/>
<text x="620" y="390" font-size="12" font-weight="bold" fill="#475569">INITIAL PARAMETERS</text>
<text x="620" y="417" font-size="18" font-weight="bold" fill="#142c43">Define an initial aircraft</text>
<text x="620" y="443" font-size="14" font-weight="normal" fill="#475569">User-selected values</text>
<text x="620" y="464" font-size="14" font-weight="normal" fill="#475569">and constraints</text>
</g>
<g id="adrpy"><rect x="35" y="365" width="220" height="116" rx="10" fill="#fff5e8" stroke="#c28836" stroke-width="1.5"/>
<text x="50" y="390" font-size="12" font-weight="bold" fill="#475569">SEPARATE TOOL / ADRpy</text>
<text x="50" y="417" font-size="18" font-weight="bold" fill="#142c43">Conceptual analysis</text>
<text x="50" y="443" font-size="14" font-weight="normal" fill="#475569">Manually defined inputs</text>
<text x="50" y="464" font-size="14" font-weight="normal" fill="#475569">Separate case-study notebook</text>
</g>
<text x="35" y="43" font-size="26" font-weight="bold" fill="#142c43">ADRpy-VTOL | From incomplete data to initial design parameters</text>
<text x="335" y="124" font-size="17" font-weight="bold" fill="#12695f">ADRpy-VTOL / PROJECT SOFTWARE</text>
<text x="335" y="146" font-size="14" font-weight="normal" fill="#475569">Three separate modules with user review and file selection</text>
<text x="1030" y="326" font-size="13" font-weight="normal" fill="#475569">User review</text>
<text x="321" y="403" font-size="15" font-weight="bold" fill="#925e1e">User transfer to ADRpy</text>
<text x="321" y="450" font-size="13" font-weight="normal" fill="#475569">Map inputs, check units and supply assumptions</text>
<text x="35" y="549" font-size="15" font-weight="normal" fill="#334155">Workflow overview: arrows indicate the working process, not automatic end-to-end execution.</text>
<text x="35" y="576" font-size="15" font-weight="normal" fill="#334155">Model inspection informs user decisions; the design assistant reads the Excel dataset.</text>
<text x="35" y="602" font-size="13" font-weight="normal" fill="#64748b">ADRpy: original framework by Andras Sobester and contributors.</text>
</g></svg>
